services:
  gateway:
    build:
      context: ./gateway
    ports:
      - 9999:9999
    networks:
      - app-network
    depends_on:
      - service-registry
      - authentication-service
    container_name: gateway

  authentication-service:
    build:
      context: ./authentication-service
    ports:
      - 9000:9000
    networks:
      - app-network
    depends_on:
      - service-registry
      - user-service
      - trainer-service
      - trainee-service
    container_name: authentication-service

  trainee-service:
    build:
      context: ./trainee-service
    ports:
      - 8081:8080
    networks:
      - app-network
    depends_on:
      - service-registry
    container_name: trainee-service

  trainer-service:
    build:
      context: ./trainer-service
    ports:
      - 8082:8080
    networks:
      - app-network
    depends_on:
      - service-registry
    container_name: trainer-service

  trainee-trainer-relationship-service:
    build:
      context: ./trainee-trainer-relationship-service
    ports:
      - 8083:8080
    networks:
      - app-network
    depends_on:
      - service-registry
    container_name: trainee-trainer-relationship-service

  training-type-service:
    build:
      context: ./training-type-service
    ports:
      - 8084:8080
    networks:
      - app-network
    depends_on:
      - service-registry
    container_name: training-type-service

  user-service:
    build:
      context: ./user-service
    ports:
      - 8085:8080
    networks:
      - app-network
    depends_on:
      - service-registry
    container_name: user-service

  training-service:
    build:
      context: ./training-service
    ports:
      - 8086:8080
    networks:
      - app-network
    depends_on:
      - service-registry
    container_name: training-service

  user-orchestration-service:
    build:
      context: ./user-orchestration-service
    ports:
      - 8087:8080
    networks:
      - app-network
    depends_on:
      - service-registry
      - user-service
      - trainee-service
      - trainer-service
      - trainee-trainer-relationship-service
    container_name: user-orchestration-service

  training-orchestration-service:
    build:
      context: ./training-orchestration-service
    ports:
      - 8088:8080
    networks:
      - app-network
    depends_on:
      - service-registry
      - training-service
      - training-type-service
      - trainee-service
      - trainer-service
      - user-service
    container_name: training-orchestration-service

  trainer-workload-service:
    build:
      context: ./trainer-workload-service
    ports:
      - 8089:8080
    networks:
      - app-network
    container_name: trainer-workload-service

  service-registry:
    build:
      context: ./service-registry
    ports:
      - 8761:8761
    networks:
      - app-network
    container_name: service-registry

networks:
  app-network: